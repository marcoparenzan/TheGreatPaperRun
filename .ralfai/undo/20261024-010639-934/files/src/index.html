<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Great Paper Run</title><meta name="description" content="Una corsa arcade in un mondo di carta. Scegli il circuito, la macchina e il cielo."><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-[#f5f0e5] text-stone-950"><main class="min-h-screen flex items-center justify-center p-6"><section id="title-screen" class="max-w-4xl text-center"><p class="uppercase tracking-[0.35em] text-sm mb-5">Un mondo di carta. Una corsa senza fine.</p><h1 class="font-black uppercase text-5xl sm:text-7xl lg:text-8xl leading-none">The Great<br><span class="text-orange-600">Paper Run</span></h1><div class="h-1 bg-black my-8"></div><p class="text-lg text-stone-600 mb-8">Monza, Montecarlo e orizzonti da scoprire.</p><button id="start" class="bg-black text-white rounded-lg px-10 py-4 text-xl font-bold hover:bg-orange-700">Prepariamo la gara →</button><p class="mt-10 text-sm"><a href="editor/circuits.html" class="underline">Editor circuiti</a> · <a href="editor/frame-compare.html" class="underline">Editor sprite</a> · <a href="editor/frames.html" class="underline">Frame stradali</a></p></section><section id="setup-screen" hidden class="w-full max-w-5xl space-y-6"><header class="flex justify-between items-center"><h2 class="text-3xl font-black">Prepara la tua corsa</h2><button id="back" class="underline">← Titolo</button></header><form id="race-form" class="space-y-6"><fieldset><legend class="text-lg font-bold mb-3">1. La macchina</legend><div id="cars" class="grid sm:grid-cols-3 gap-3"></div><label class="mt-4 inline-flex items-center gap-3 rounded-lg border-2 border-black bg-white px-4 py-3 font-bold">Colore della carrozzeria <input id="car-color" type="color" value="#ffffff" class="h-10 w-16 cursor-pointer"></label></fieldset><div class="grid md:grid-cols-2 gap-5"><label class="block border-2 border-black rounded-xl bg-white p-5"><span class="block font-bold mb-3">2. Il circuito</span><select id="circuit" class="w-full border border-stone-400 rounded p-3"></select><p id="circuit-info" class="text-sm text-stone-500 mt-3"></p></label><fieldset class="border-2 border-black rounded-xl bg-white p-5"><legend class="font-bold px-2">3. Il cielo</legend><div id="weather" class="flex flex-wrap gap-3"></div><div id="palette" class="mt-4 h-16 rounded-lg border border-black"></div></fieldset></div><label class="block rounded-xl border-2 border-black bg-white p-5"><span class="block font-bold mb-3">4. Ambientazione panoramica</span><select id="background" class="w-full border border-stone-400 rounded p-3"></select><p class="text-sm text-stone-500 mt-2">Il fondale segue la rotazione a 360°; pista e clima restano indipendenti.</p></label><p id="setup-status" role="status" class="text-stone-600">Caricamento configurazione…</p><div class="flex flex-wrap items-center justify-between gap-4"><p class="text-sm">↑ / W accelera · ↓ / S frena · ← → / A D sterza</p><button id="race-button" disabled class="bg-orange-600 text-white rounded-lg px-8 py-4 text-xl font-bold hover:bg-orange-700 disabled:opacity-40">In pista →</button></div></form></section></main><script type="module" src="js/setup-main.js?v=elevation-5"></script></body></html>
